# Production compose override.
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up
# WARNING: uses real YNAB credentials. Never run from a coding-agent session.
services:
  ynab-mcp:
    env_file: .env.prod
    restart: unless-stopped
    ports:
      - "3001:3001"
# INSTALL_DEV defaults to false in Dockerfile — no override needed
