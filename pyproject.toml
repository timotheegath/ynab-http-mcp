[project]
name = "ynab-http-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "timotheegath", email = "timothee.gathmann@ik.me" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1",
    "ynab>=4.2.0",
]

[project.scripts]
ynab-http-mcp = "ynab_http_mcp:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rich>=15.0.0",
    "ruff>=0.15.21",
]
